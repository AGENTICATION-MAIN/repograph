name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Invariant Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest -v --durations=10

      - name: Run Performance Benchmarks
        run: |
          pactum benchmark -n 1000

      - name: Run Example Workflows
        run: |
          python examples/01_basic_two_service_barter.py
          python examples/02_cross_api_rate_limit_rebalancing.py
          python examples/03_gpu_vram_for_priority_queue_swap.py
          python examples/04_dynamic_equilibrium_market.py
