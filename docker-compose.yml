version: '3.8'

services:
  pactum-node-1:
    build: .
    container_name: pactum-node-billing
    ports:
      - "8000:8000"
    environment:
      - PACTUM_HOST=0.0.0.0
      - PACTUM_PORT=8000
      - PACTUM_ENV=production
      - PACTUM_SECRET_KEY=${PACTUM_SECRET_KEY:-pactum-secret-key-32bytes-for-coasian-barter-kernel}
    restart: unless-stopped
